services:
  mail:
    image: axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "127.0.0.1:55434:8025"
  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    env_file: ./.local/auth.env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:55433
      GOTRUE_SITE_URL: http://127.0.0.1:3100
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3100/**,http://127.0.0.1:3101/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://127.0.0.1:55433
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 900
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@ourspace.test
      GOTRUE_SMTP_SENDER_NAME: Our Space Local
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${OURSPACE_APP_ORIGIN:-http://127.0.0.1:3102}/account/recovery-link
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_RECOVERY_CODES_ENROLL_ENABLED: "true"
      GOTRUE_MFA_RECOVERY_CODES_VERIFY_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      # Local capture inbox only; enables repeated integration runs.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      LOG_LEVEL: warn
    ports:
      - "127.0.0.1:55433:9999"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 3s
      timeout: 3s
      retries: 30
